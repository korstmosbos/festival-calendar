name: Security and data check

# Runs on every pull request and on main. Uses the plain pull_request trigger, so changes proposed from
# forks run with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Security and data check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan for hidden characters, unsafe code and unapproved files
        run: python3 -I scripts/security_check.py
      - name: Validate festival data and build the feeds
        run: python3 -I scripts/build.py
