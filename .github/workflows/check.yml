name: Security and data check

# Runs on every pull request. Uses the plain pull_request trigger, so changes proposed from
# forks run with a read-only token and no secrets.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Security and data check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for hidden characters, unsafe code and unapproved files
        run: python3 -I scripts/security_check.py
      - name: Validate festival data and build the feeds
        run: python3 -I scripts/build.py
